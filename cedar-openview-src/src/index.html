<!doctype html>
<html spellcheck="false" lang="en">
<head>
  <meta charset="utf-8">
  <title></title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- load the component -->
  <!--
    Copied as an asset and loaded by tag, rather than listed in angular.json's
    `scripts`. A `scripts` entry is re-minified by this build, and Terser drops
    the `var X = class t extends Error { static F = new t(...) }` that CEE's
    esbuild bundle contains — leaving the static initializers behind a binding it
    deleted, so the custom element never registers. The file arrives minified;
    nothing here needs to touch it.
  -->
  <script src="node_modules/cedar-embeddable-editor/cedar-embeddable-editor.js" type="text/javascript"></script>
</head>

</body>
