<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title></title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <!-- This div is needed when targeting ES5. It will add the adapter to browsers that support customElements, which require ES6 classes -->
  <div id="ce-es5-shim">
    <script type="text/javascript">
      if (!window.customElements) {
        var ceShimContainer = document.querySelector('#ce-es5-shim');
        ceShimContainer.parentElement.removeChild(ceShimContainer);
      }
    </script>
    <script type="text/javascript"
      src="node_modules/@webcomponents/webcomponentsjs/custom-elements-es5-adapter.js"></script>
  </div>
  <!-- load the webcomponents loader, which injects the necessary polyfill bundle -->
  <script src="node_modules/@webcomponents/webcomponentsjs/webcomponents-loader.js"></script>
  <!-- load the component -->
  <!--
    Copied as an asset and loaded by tag, rather than listed in angular.json's
    `scripts`. A `scripts` entry is re-minified by this build, and Terser drops
    the `var X = class t extends Error { static F = new t(...) }` that CEE's
    esbuild bundle contains — leaving the static initializers behind a binding it
    deleted, so the custom element never registers. The file arrives minified;
    nothing here needs to touch it.
  -->
  <script src="node_modules/cedar-embeddable-editor/cedar-embeddable-editor.js" type="text/javascript"></script>
</head>
<body>
<app-root></app-root>
</body>
</html>
