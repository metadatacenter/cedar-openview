<header class="main__header">
  <div class="row">
    <div class="cedar__logo column">
      <!--
        An anchor rather than a click handler, so the wordmark behaves like the link it looks
        like: reachable by keyboard, and showing where it goes before it is followed. The image
        carries the name, which is what names the link for a reader who cannot see it.
      -->
      <a href="https://metadatacenter.readthedocs.io/en/latest/user-guide/openview/"
        target="_blank" rel="noopener" matTooltip="Read more about OpenView">
        <img src="assets/img/logo/cedar-open-view-logo.png" alt="{{'App.NavTitle' | translate}}">
      </a>
    </div>
    <div class="artifact-title column">
      @if (uiService.type) {
        <mat-expansion-panel class="expansion-container" (opened)="expansionOpened()" (closed)="expansionClosed()"
          >
          <mat-expansion-panel-header>
            <mat-panel-title>
              <p class="artifact-title-paragraph">
                {{uiService.title}} - {{'type.' + uiService.type | translate}}
              </p>
            </mat-panel-title>
          </mat-expansion-panel-header>
        </mat-expansion-panel>
      }
    </div>
    <div class="button-container column">
      <button (click)="openInNewWindow('http://metadatacenter.org')" mat-button mat-button
        matTooltip="Read more about CEDAR">
        metadatacenter.org
      </button>
    </div>
  </div>
</header>
