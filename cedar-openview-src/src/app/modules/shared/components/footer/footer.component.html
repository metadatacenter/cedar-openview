<div class="wide-container">

  <footer class="main__footer">
    <div class="flex">
      <!--
        The text and the mark side by side, rather than the mark floated out of the flow. Floated at
        20% of the container it was about 190px tall against 80px of text, so the footer was more
        than twice the height of what it says.
      -->
      <div class="paragraph__section">
        <div class="footer-text">
          <h1 class="footer-title">{{ 'Footer.Title' | translate }}</h1>
          <p>
            {{ 'Footer.Maintainer' | translate }}
          </p>
          <p>
            <a href="https://metadatacenter.org/" target="_blank" rel="noreferrer">{{ 'Footer.Visit' | translate }}</a>
          </p>
        </div>
        <a class="footer-logo" href="https://computationalmedicine.stanford.edu/" target="_blank" rel="noreferrer">
          <img src="assets/img/computational-medicine-logo.png" class="computational-medicine-logo"
               alt="{{ 'Footer.LogoAlt' | translate }}">
        </a>
      </div>
    </div>

  </footer>
</div>
