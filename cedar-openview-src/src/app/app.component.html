<app-spinner></app-spinner>

<div class="root__container">
  <app-navbar></app-navbar>

  <main>
    <router-outlet (activate)="activePage = $event" (deactivate)="activePage = null"></router-outlet>
  </main>

  <!-- Keep its final layout, but do not paint the footer above content that is still loading. -->
  <app-footer [style.visibility]="activePage && (activePage.contentReady?.() ?? true) ? null : 'hidden'"></app-footer>
</div>
