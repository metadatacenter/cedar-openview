name: Build

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NPM_CONFIG_STRICT_ALLOW_SCRIPTS: "true"

jobs:
  design-token-adoption:
    uses: metadatacenter/cedar-design-tokens/.github/workflows/adoption.yml@develop

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cedar-openview-src

    steps:
      - name: Check out OpenView
        uses: actions/checkout@v7

      - name: Use Node 24.19.0
        uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: cedar-openview-src/package-lock.json

      - name: Install the release dependency graph
        run: npm ci

      - name: Build and verify the production distribution
        run: npm run build

      - name: Test shared icons and application rendering
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - uses: actions/checkout@v4
        with:
          repository: metadatacenter/cedar-design-tokens
          ref: develop
          path: shared-design-checks

      - name: Reject independent icon sources
        working-directory: .
        run: python3 shared-design-checks/tools/check_icons.py --repo .
